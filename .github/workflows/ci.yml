name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check, lint, and test
        run: npm run check

      - name: Audit dependency advisories
        run: npm run audit:dependencies

      - name: Build production application
        run: npm run build

      - name: Run structural SEO release crawl
        shell: bash
        run: |
          npm run start -- -p 3002 > /tmp/pandacodegen-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://localhost:3002/ > /dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent --show-error http://localhost:3002/ > /dev/null
          npm run smoke:release -- http://localhost:3002
          npm run seo:check -- --base-url http://localhost:3002 --concurrency 6 --timeout-ms 30000 --max-run-ms 300000
