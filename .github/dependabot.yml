version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
    ignore:
      # TypeScript 7 is a new compiler; stay on 5.x until Next.js supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Node types follow the Node version the site runs on (24), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # react and react-dom must move together; update them by hand.
      - dependency-name: react
      - dependency-name: react-dom
