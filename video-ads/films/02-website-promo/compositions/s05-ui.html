<!doctype html>
<html>
<head><meta charset="UTF-8" /><title>s05 pop-out UI cards</title></head>
<body>
<template>
<style>
#s05 { position: absolute; inset: 0; overflow: hidden; }
#s05-all { position: absolute; inset: 0; }
#s05-b .vp { background: var(--card) no-repeat top center / cover; }
#s05 .ui { position: absolute; border-radius: 14px; background: var(--card); padding: 16px; box-shadow: var(--shadow); }
#s05 .ui img { display: block; width: 100%; }
</style>

<div id="s05" data-composition-id="s05">
  <h2 class="ttl" id="s05-h"><span class="ln"><span class="in">Online stores</span></span><span class="ln"><span class="in">and quote forms<b>.</b></span></span></h2>
  <div id="s05-all">
    <div class="browser" id="s05-b"><div class="bar"><i></i><i></i><i></i></div><div class="vp" id="s05-vp"></div></div>
    <div class="ui" id="s05-u1"><img src="assets/work/ui-backing-shape.png" alt="" /></div>
    <div class="ui" id="s05-u2"><img src="assets/work/ui-size-quantity.png" alt="" /></div>
    <div class="ui" id="s05-u3"><img src="assets/work/ui-upload.png" alt="" /></div>
  </div>
</div>

<script>
(() => {
  const K = window.KIT;
  document.getElementById("s05-vp").style.backgroundImage = `url(${K.P.mcpProd})`;
  K.ready("s05", (tl) => {
    const [W, H] = K.SIZE;
    const f = K.F.format;
    const h = K.head(document.getElementById("s05-h"),
      f === "16x9" ? { x: 150, y: 86, w: 900, size: 64, anchor: "top" } : f === "9x16" ? { x: 80, y: 240, w: 900, size: 88, anchor: "top" } : { x: 60, y: 50, w: 900, size: 54, anchor: "top" });
    // Browser [x, y, w, h] and the three cards [x, y, w].
    const top = h.bottom + (f === "1x1" ? 40 : 70);
    const L = {
      "16x9": { b: [150, 300, 1040, 650], u: [[1250, 330, 540], [1250, 475, 540], [1250, 735, 540]] },
      "9x16": { b: [60, top, 960, 600], u: [[150, top + 650, 780], [150, top + 830, 780], [150, top + 1190, 780]] },
      "1x1": { b: [50, top, 660, 413], u: [[620, top + 20, 400], [620, top + 145, 400], [620, top + 330, 400]] },
    }[f];
    Object.assign(document.getElementById("s05-b").style, { left: L.b[0] + "px", top: L.b[1] + "px", width: L.b[2] + "px", height: L.b[3] + "px" });
    L.u.forEach(([x, y, w], i) => Object.assign(document.getElementById("s05-u" + (i + 1)).style, { left: x + "px", top: y + "px", width: w + "px" }));

    // Browser rises in (lands on the cut at 0.6); then pieces of the form slide out of it as cards.
    K.inn(tl, "#s05-b", { y: 340 }, { y: 0 }, 0, 0.9, "power3.out");
    K.reveal(tl, document.getElementById("s05-h"), 0.55, 0.12);
    [1, 2, 3].forEach((i) => {
      const [x] = L.u[i - 1];
      K.inn(tl, "#s05-u" + i, { x: L.b[0] + L.b[2] * 0.55 - x, scale: 0.86, opacity: 0 }, { x: 0, scale: 1, opacity: 1 }, 1.0 + (i - 1) * 0.3, 0.8, "power3.out");
      K.drift(tl, "#s05-u" + i, { y: 0 }, { y: i % 2 ? -14 : 12 }, 1.9 + (i - 1) * 0.3, 2.6);
    });

    // Exit (cut at 5.4): the whole layout pushes off to the left.
    K.conceal(tl, document.getElementById("s05-h"), 4.55);
    K.out(tl, "#s05-all", { x: 0 }, { x: -W }, 4.8, 0.6, "power3.in");
  });
})();
</script>
</template>
</body>
</html>
