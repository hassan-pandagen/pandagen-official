<script>
(() => {
  const K = window.KIT;
  K.ready("s01", (tl) => {
    const head = document.getElementById("s01-h");
    const vis = document.getElementById("s01-v");
    K.head(head);
    const f = K.F.format;
    // 16:9: visual right. 9:16 and 1:1: below the headline.
    K.place(vis, 900, 640, f === "16x9" ? null : f === "9x16" ? { y: 700, h: 760 } : { y: 300, h: 720 });

    // Line one is on screen from the first frame (thumbnail); line two lands on the first beat.
    K.reveal(tl, document.getElementById("s01-h2"), 0.3);
    // The generic site sits at an angle and turns slowly toward us.
    gsap.set("#s01-b", { transformOrigin: "50% 50%" });
    K.settle(tl, "#s01-b", { rotateY: -18, rotateX: 8 }, { rotateY: -8, rotateX: 3 }, 0, 4.2);
    K.drift(tl, "#s01-shine", { xPercent: -120 }, { xPercent: 320 }, 0.1, 1.5);
    // A visitor looks for a way to book: the cursor drifts to the dashed gap where a button should be.
    K.inn(tl, "#s01-cur", { x: 760, y: 560, opacity: 0 }, { x: 156, y: 337, opacity: 1 }, 0.7, 1.3, "power2.inOut");
    if (!K.R) tl.fromTo("#s01-ring", { x: 160, y: 340, scale: 0.3, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, 2.1);
    K.pop(tl, "#s01-ask", 2.35);
    tl.fromTo("#s01-btn", { borderColor: "#B5B0A6" }, { borderColor: "#AD3D0B", duration: 0.3, ease: "none" }, 2.2);

    // Exit on the cut (4.8): headline rises away, the site falls back.
    K.conceal(tl, head, 3.95);
    K.out(tl, "#s01-b", { y: 0, opacity: 1 }, { y: 260, rotateX: 40, opacity: 0 }, 4.05, 0.55);
    K.out(tl, ["#s01-cur", "#s01-ask"], { opacity: 1 }, { opacity: 0, y: 120 }, 3.95, 0.45);
  });
})();
</script>
