<!doctype html>
<html>
<head><meta charset="UTF-8" /><title>s07 talk to the founders</title></head>
<body>
<template>
<style>
#s07 { position: absolute; inset: 0; }
#s07 .node { position: absolute; display: flex; align-items: center; justify-content: center; gap: 16px; font: 600 32px/1 var(--ui); white-space: nowrap; border-radius: 999px; }
#s07-you { left: 230px; top: 0; width: 300px; height: 96px; background: var(--paper-hi); color: var(--ink); box-shadow: 0 2px 0 rgba(28, 25, 23, .06), 0 20px 40px -18px rgba(28, 25, 23, .35); }
#s07-you svg { width: 40px; height: 40px; }
#s07-fd { left: 40px; top: 724px; width: 680px; height: 112px; background: var(--dark); color: var(--on-dark); font-size: 34px; box-shadow: 0 30px 60px -24px rgba(28, 25, 23, .55); }
#s07-fd .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--on-dark-accent); }
#s07 .mid { position: absolute; left: 180px; width: 400px; height: 84px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--paper);
  border: 2px solid rgba(28, 25, 23, .18); font: 500 30px/1 var(--ui); color: var(--quiet); }
#s07 .mid .x { position: absolute; left: 36px; right: 36px; top: 50%; height: 4px; margin-top: -2px; background: var(--accent); transform-origin: 0 50%; }
#s07-m1 { top: 168px; } #s07-m2 { top: 306px; } #s07-m3 { top: 444px; }
#s07-dash { position: absolute; left: 378px; top: 96px; width: 4px; height: 628px; background-image: linear-gradient(rgba(28, 25, 23, .3) 50%, transparent 50%); background-size: 4px 18px; }
#s07-line { position: absolute; left: 376px; top: 96px; width: 8px; height: 628px; border-radius: 4px; background: var(--accent); transform-origin: 50% 0; }
#s07-tag { left: 430px; top: 580px; }
</style>

<div id="s07" data-composition-id="s07">
  <h2 class="head" id="s07-h"><span class="ln"><span class="in">Work with experts.</span></span><span class="ln it"><span class="in">Talk to the founders.</span></span></h2>
  <div id="s07-v">
    <div id="s07-dash"></div>
    <div id="s07-line"></div>
    <div class="node" id="s07-you"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="13" r="8" fill="#1C1917"/><path d="M5 37c1.5-8 7.5-12 15-12s13.5 4 15 12z" fill="#1C1917"/></svg>You</div>
    <div class="mid" id="s07-m1">Sales rep<span class="x" id="s07-x1"></span></div>
    <div class="mid" id="s07-m2">Account manager<span class="x" id="s07-x2"></span></div>
    <div class="mid" id="s07-m3">Project manager<span class="x" id="s07-x3"></span></div>
    <div class="node" id="s07-fd"><span class="dot"></span>The founders who build it</div>
    <div class="chip" id="s07-tag"><span class="tick"></span>Direct line</div>
  </div>
</div>

<script>
(() => {
  const K = window.KIT;
  K.ready("s07", (tl) => {
    const f = K.F.format;
    const h = K.head(document.getElementById("s07-h"));
    const top = h.bottom + (f === "1x1" ? 30 : 80);
    K.place(document.getElementById("s07-v"), 760, 836,
      f === "16x9" ? { x: 980, y: 110, w: 820, h: 860 } : f === "9x16" ? { x: 50, y: top, w: 980, h: 1560 - top } : { x: 80, y: top, w: 920, h: 1050 - top });

    // The chain builds top to bottom (first node lands on the cut at 0.6).
    K.pop(tl, "#s07-you", 0.35);
    if (K.R) tl.fromTo("#s07-dash", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "none" }, 0.5);
    else tl.fromTo("#s07-dash", { clipPath: "inset(0 0 100% 0)" }, { clipPath: "inset(0 0 0% 0)", duration: 1.0, ease: "power2.inOut" }, 0.45);
    ["#s07-m1", "#s07-m2", "#s07-m3"].forEach((m, i) => K.pop(tl, m, 0.65 + i * 0.18));
    K.pop(tl, "#s07-fd", 1.25);
    K.reveal(tl, document.getElementById("s07-h"), 0.7);
    gsap.set("#s07-line", { scaleY: 0 });
    gsap.set(["#s07-x1", "#s07-x2", "#s07-x3"], { scaleX: 0 });
    // The middle three are crossed out and drop away; one straight line is left.
    [1, 2, 3].forEach((i) => {
      if (K.R) tl.fromTo("#s07-x" + i, { scaleX: 1, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.45, ease: "none", immediateRender: false }, 2.0);
      else tl.fromTo("#s07-x" + i, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out", immediateRender: false }, 1.95 + (i - 1) * 0.12);
      K.out(tl, "#s07-m" + i, { opacity: 1, y: 0, rotation: 0 }, { opacity: 0, y: 110, rotation: i === 2 ? 7 : -6 }, 2.75 + (i - 1) * 0.1, 0.5, "power2.in");
    });
    if (K.R) tl.fromTo("#s07-line", { scaleY: 1, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.5, ease: "none", immediateRender: false }, 3.3);
    else tl.fromTo("#s07-line", { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.inOut", immediateRender: false }, 3.2);
    K.pop(tl, "#s07-tag", 3.7);

    // Exit: the end card wipes over this scene from 4.8; the headline lifts as it does.
    K.conceal(tl, document.getElementById("s07-h"), 4.4);
  });
})();
</script>
</template>
</body>
</html>
