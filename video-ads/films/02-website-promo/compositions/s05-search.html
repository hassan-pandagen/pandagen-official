<!doctype html>
<html>
<head><meta charset="UTF-8" /><title>s05 search and AI</title></head>
<body>
<template>
<style>
#s05 { position: absolute; inset: 0; }
#s05 .persp { position: absolute; inset: 0; perspective: 2400px; perspective-origin: 50% 30%; }
#s05-b { left: 20px; top: 10px; width: 860px; height: 431px; }
#s05-b .vp { background: var(--dark); }
#s05-b .vp img { display: block; width: 100%; }
#s05-scan { position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--on-dark-accent); box-shadow: 0 0 18px 4px rgba(232, 118, 58, .55); opacity: 0; }
#s05-t1 { left: 20px; top: 500px; }
#s05-t2 { left: 20px; top: 588px; }
#s05-t3 { left: 20px; top: 676px; }
#s05-fine { white-space: nowrap; }
</style>

<div id="s05" data-composition-id="s05">
  <h2 class="head" id="s05-h"><span class="ln"><span class="in">Easy for Google</span></span><span class="ln it"><span class="in">and AI to read.</span></span></h2>
  <p class="fine" id="s05-fine">Rankings and AI answers aren't guaranteed.</p>
  <div id="s05-v">
    <div class="persp">
      <div class="browser" id="s05-b">
        <div class="bar"><i></i><i></i><i></i><b>pandacodegen.com</b></div>
        <div class="vp" id="s05-vp"><img src="assets/site/crop-ai.png" alt="" /><div id="s05-scan"></div></div>
      </div>
    </div>
    <div class="chip" id="s05-t1"><span class="tick"></span>Same details everywhere</div>
    <div class="chip" id="s05-t2"><span class="tick"></span>Structured data</div>
    <div class="chip" id="s05-t3"><span class="tick"></span>Claims with sources</div>
  </div>
</div>

<script>
(() => {
  const K = window.KIT;
  K.ready("s05", (tl) => {
    const f = K.F.format;
    const h = K.head(document.getElementById("s05-h"), f === "16x9" ? { y: 500 } : null);
    const fine = document.getElementById("s05-fine");
    fine.style.left = K.SLOT.head.x + "px";
    fine.style.top = h.bottom + (f === "1x1" ? 14 : 30) + "px";
    if (f === "1x1") fine.style.fontSize = "18px";
    const top = h.bottom + (f === "1x1" ? 50 : 90);
    K.place(document.getElementById("s05-v"), 900, 760,
      f === "16x9" ? { x: 940, y: 150, w: 900, h: 780 } : f === "9x16" ? { x: 50, y: top, w: 980, h: 1580 - top } : { x: 80, y: top, w: 920, h: 1050 - top });

    // The page section slides in from the right (lands on the cut at 0.6).
    gsap.set("#s05-b", { transformOrigin: "50% 50%" });
    K.inn(tl, "#s05-b", { x: 700, rotateY: -38, opacity: 0 }, { x: 0, rotateY: -8, opacity: 1 }, 0, 1.0, "power3.out");
    K.drift(tl, "#s05-b", { rotateY: -8 }, { rotateY: -3 }, 1.0, 4.0);
    K.reveal(tl, document.getElementById("s05-h"), 0.7);
    K.inn(tl, "#s05-fine", { opacity: 0 }, { opacity: 1 }, 1.4, 0.6, "none");
    // A reading line passes down the section; each point it reads pops out below.
    if (!K.R) {
      tl.fromTo("#s05-scan", { y: 0, opacity: 0 }, { y: 380, duration: 1.8, ease: "sine.inOut", immediateRender: false }, 1.2);
      tl.fromTo("#s05-scan", { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none", immediateRender: false }, 1.2);
      tl.fromTo("#s05-scan", { opacity: 1 }, { opacity: 0, duration: 0.25, ease: "none", immediateRender: false }, 2.85);
    }
    K.pop(tl, "#s05-t1", 1.75);
    K.pop(tl, "#s05-t2", 2.3);
    K.pop(tl, "#s05-t3", 2.85);

    // Exit on the cut (5.4): everything slides left.
    K.conceal(tl, document.getElementById("s05-h"), 4.5);
    K.out(tl, "#s05-fine", { opacity: 1 }, { opacity: 0 }, 4.5, 0.4);
    K.out(tl, ["#s05-t1", "#s05-t2", "#s05-t3"], { opacity: 1, x: 0 }, { opacity: 0, x: -200 }, 4.6, 0.5);
    K.out(tl, "#s05-b", { opacity: 1, x: 0 }, { opacity: 0, x: -600 }, 4.65, 0.55, "power2.in");
  });
})();
</script>
</template>
</body>
</html>
