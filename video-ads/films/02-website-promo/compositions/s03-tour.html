<!doctype html>
<html>
<head><meta charset="UTF-8" /><title>s03 laptop tour</title></head>
<body>
<template>
<style>
#s03 { position: absolute; inset: 0; }
#s03 .persp { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 50% 30%; }
#s03-lap { left: 0; top: 0; }
#s03 .screen .vp { top: 40px; }
#s03-list { position: absolute; font: 400 64px/1.18 var(--display); text-transform: uppercase; color: var(--ink); }
#s03-list .eb { position: static; display: block; margin-bottom: .5em; font-size: 22px; }
#s03-list .row { display: flex; align-items: flex-start; gap: .38em; white-space: nowrap; padding: .08em 0; }
#s03-list .n { font: 600 .34em/1 var(--ui); letter-spacing: .08em; color: var(--accent-text); padding-top: .5em; width: 2.6em; flex: none; }
#s03-list .t { display: block; }
</style>

<div id="s03" data-composition-id="s03">
  <div id="s03-list">
    <span class="eyebrow eb" id="s03-eb">What you get</span>
    <div class="row" id="s03-r1"><span class="n">01</span><span class="t">Designed for your business</span></div>
    <div class="row" id="s03-r2"><span class="n">02</span><span class="t">A page for every service</span></div>
    <div class="row" id="s03-r3"><span class="n">03</span><span class="t">Routine work, automated</span></div>
    <div class="row" id="s03-r4"><span class="n">04</span><span class="t">A clear plan to launch</span></div>
  </div>
  <div id="s03-v">
    <div class="persp">
      <div class="laptop" id="s03-lap">
        <div class="lid"><div class="screen">
          <div class="bar"><i></i><i></i><i></i><b>pandacodegen.com</b></div>
          <div class="vp" id="s03-vp"><div class="page" id="s03-page" data-layout-allow-overflow>
            <img src="assets/site/home-head.png" alt="" /><img src="assets/site/home-services.png" alt="" /><img src="assets/site/home-automation.png" alt="" /><img src="assets/site/home-process.png" alt="" />
          </div></div>
        </div></div>
        <div class="base"></div>
      </div>
    </div>
  </div>
</div>

<script>
(() => {
  const K = window.KIT;
  K.ready("s03", (tl) => {
    const f = K.F.format;
    const list = document.getElementById("s03-list");
    // List: left column in 16:9, above the laptop in 9:16 and 1:1.
    const L = { "16x9": { x: 120, w: 740, size: 70 }, "9x16": { x: 80, y: 240, w: 860, size: 72 }, "1x1": { x: 90, y: 62, w: 900, size: 46 } }[f];
    list.style.left = L.x + "px"; list.style.width = L.w + "px";
    let s = L.size; list.style.fontSize = s + "px";
    const widest = () => Math.max(...[...list.querySelectorAll(".row")].map((r) => r.scrollWidth));
    for (let i = 0; i < 60 && widest() > L.w; i++) { s *= 0.97; list.style.fontSize = s + "px"; }
    const lh = list.getBoundingClientRect().height;
    list.style.top = (f === "16x9" ? 540 - lh / 2 : L.y) + "px";
    const below = f === "16x9" ? 0 : L.y + lh;
    K.place(document.getElementById("s03-v"), 1120, 700,
      f === "16x9" ? { x: 880, y: 150, w: 1000, h: 780 } : f === "9x16" ? { x: 30, y: below + 60, w: 1020, h: 1560 - below - 60 } : { x: 70, y: below + 24, w: 940, h: 1040 - below - 24 });

    // Laptop rises in and turns toward us (lands on the cut at 0.6).
    gsap.set("#s03-lap", { transformOrigin: "50% 60%" });
    K.inn(tl, "#s03-lap", { y: 420, rotateX: 34, rotateY: -30, opacity: 0 }, { y: 0, rotateX: 6, rotateY: -12, opacity: 1 }, 0, 1.0, "power3.out");
    K.drift(tl, "#s03-lap", { rotateY: -12, rotateX: 6 }, { rotateY: -5, rotateX: 3 }, 1.0, 8.6);
    K.inn(tl, "#s03-eb", { opacity: 0, y: 16 }, { opacity: 1, y: 0 }, 0.45, 0.5, "power2.out");

    // One list line per bar, each with the part of the page that shows it. Scroll stops in page pixels.
    const STOPS = [0, 454, 2357, 3064];
    const AT = [0.6, 3.0, 5.4, 7.8];
    for (let i = 0; i < 4; i++) {
      const row = "#s03-r" + (i + 1);
      K.inn(tl, row, { opacity: 0, x: -40 }, { opacity: 1, x: 0 }, AT[i] + 0.25, 0.7, "power3.out");
      if (i > 0) {
        K.move(tl, "#s03-page", { y: -STOPS[i - 1] }, { y: -STOPS[i] }, AT[i] - 0.35, 1.0, "power3.inOut", "#s03-vp");
        tl.fromTo("#s03-r" + i, { opacity: 1 }, { opacity: 0.32, duration: 0.4, ease: "none", immediateRender: false }, AT[i] + 0.2);
      }
    }

    // Exit on the cut (10.2): list fades up, laptop swings off to the left.
    K.out(tl, "#s03-list", { opacity: 1, y: 0 }, { opacity: 0, y: -40 }, 9.3, 0.45);
    K.out(tl, "#s03-lap", { x: 0, opacity: 1 }, { x: -520, rotateY: 28, opacity: 0 }, 9.45, 0.55, "power2.in");
  });
})();
</script>
</template>
</body>
</html>
