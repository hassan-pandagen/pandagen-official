<!doctype html>
<html>
<head><meta charset="UTF-8" /><title>s04 phone</title></head>
<body>
<template>
<style>
#s04 { position: absolute; inset: 0; }
#s04 .persp { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 40%; }
#s04-ph { left: 190px; top: 30px; }
#s04-c1 { left: -10px; top: 170px; }
#s04-c2 { left: 500px; top: 390px; }
#s04-c3 { left: 10px; top: 610px; }
</style>

<div id="s04" data-composition-id="s04">
  <h2 class="head" id="s04-h"><span class="ln"><span class="in">Looks sharp</span></span><span class="ln it"><span class="in">on every phone.</span></span></h2>
  <div id="s04-v">
    <div class="persp">
      <div class="phone" id="s04-ph"><div class="screen" id="s04-scr">
        <div class="island"></div>
        <div class="page" id="s04-page" data-layout-allow-overflow><img src="assets/site/m-home-head.png" alt="" /><img src="assets/site/m-home-services.png" alt="" /><img src="assets/site/m-home-automation.png" alt="" /></div>
      </div></div>
    </div>
    <div class="chip" id="s04-c1"><span class="tick"></span>Easy to read</div>
    <div class="chip" id="s04-c2"><span class="tick"></span>Easy to tap</div>
    <div class="chip" id="s04-c3"><span class="tick"></span>Quick to load</div>
  </div>
</div>

<script>
(() => {
  const K = window.KIT;
  K.ready("s04", (tl) => {
    const f = K.F.format;
    const h = K.head(document.getElementById("s04-h"));
    K.place(document.getElementById("s04-v"), 760, 860,
      f === "16x9" ? { x: 960, y: 90, w: 840, h: 900 } : f === "9x16" ? { x: 40, y: h.bottom + 70, w: 1000, h: 1580 - h.bottom - 70 } : { x: 80, y: h.bottom + 20, w: 920, h: 1050 - h.bottom - 20 });

    // The phone spins in to face us (lands on the cut at 0.6), then the mobile page scrolls.
    gsap.set("#s04-ph", { transformOrigin: "50% 50%" });
    K.inn(tl, "#s04-ph", { rotateY: 75, y: 160, opacity: 0 }, { rotateY: -10, y: 0, opacity: 1 }, 0, 1.0, "power3.out");
    K.drift(tl, "#s04-ph", { rotateY: -10 }, { rotateY: -3 }, 1.0, 4.0);
    K.reveal(tl, document.getElementById("s04-h"), 0.7);
    // Mobile page stops: header, services, the service list, automation.
    K.move(tl, "#s04-page", { y: 0 }, { y: -268 }, 1.25, 0.8, "power3.inOut", "#s04-page");
    K.move(tl, "#s04-page", { y: -268 }, { y: -590 }, 2.45, 0.8, "power3.inOut", "#s04-page");
    K.move(tl, "#s04-page", { y: -590 }, { y: -2977 }, 3.55, 1.0, "power3.inOut", "#s04-page");
    K.pop(tl, "#s04-c1", 1.5);
    K.pop(tl, "#s04-c2", 2.2);
    K.pop(tl, "#s04-c3", 2.9);

    // Exit on the cut (5.4).
    K.conceal(tl, document.getElementById("s04-h"), 4.5);
    K.out(tl, ["#s04-c1", "#s04-c2", "#s04-c3"], { opacity: 1 }, { opacity: 0, y: -30 }, 4.5, 0.4);
    K.out(tl, "#s04-ph", { x: 0, opacity: 1 }, { x: 640, rotateY: -40, opacity: 0 }, 4.65, 0.55, "power2.in");
  });
})();
</script>
</template>
</body>
</html>
